{% extends "base.html" %}
{% block title %}{{ t('Log in') }} — Lichtfabriek{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:80px auto;">
  <h1>{{ t('Log in') }}</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ session.get('csrf','') }}">
    <input name="username" placeholder="{{ t('Username') }}" autofocus required>
    <input name="password" type="password" placeholder="{{ t('Password') }}" required>
    <button type="submit">{{ t('Log in') }}</button>
  </form>
  <p class="muted">{{ t('Accounts are created by the makerspace admin.') }}</p>
</div>
{% endblock %}
