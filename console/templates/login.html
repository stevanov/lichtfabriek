{% extends "base.html" %}
{% block title %}Log in — Lichtfabriek{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:80px auto;">
  <h1>Log in</h1>
  <form method="post">
    <input name="username" placeholder="Username" autofocus required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">Accounts are created by the makerspace admin.</p>
</div>
{% endblock %}
