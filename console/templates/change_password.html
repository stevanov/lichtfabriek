{% extends "base.html" %}
{% block title %}{{ t('Change password') }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:80px auto;">
  <h1>{{ t('Change password') }}</h1>
  <p class="muted">{{ t('You must set a new password on first login.') }}</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ session.get('csrf','') }}">
    <input name="password" type="password" placeholder="{{ t('New password') }}" required>
    <input name="password2" type="password" placeholder="{{ t('Repeat new password') }}" required>
    <button type="submit">{{ t('Change password') }}</button>
  </form>
</div>
{% endblock %}
