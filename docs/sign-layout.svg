<svg width="100%" viewBox="0 0 380 530" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Stads Fabriek LED stack</title>
<desc>Three stacked IBC containers with a metal frame, a sign, and a black LED board on top where a hammer pivots from its handle end on the right, swings its head down to the left onto an anvil, sparks, then jumps back up.</desc>
<defs>
<pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#555" stroke-width="0.6"/></pattern>
<style>
.hm{transform-origin:170px 118px}
.sp{opacity:0}
@media (prefers-reduced-motion:no-preference){
.hm{animation:sw 3.2s infinite;animation-timing-function:step-end}
.sp{animation:sk 3.2s infinite;animation-timing-function:step-end}
}
@keyframes sw{0%{transform:rotate(0deg)}22%{transform:rotate(-45deg)}44%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
@keyframes sk{0%{opacity:0}65%{opacity:1}78%{opacity:0}100%{opacity:0}}
</style>
</defs>
<rect x="40" y="20" width="160" height="170" fill="#111"/>
<path d="M70 128 L190 128 L190 140 L155 146 L165 172 L185 172 L185 182 L85 182 L85 172 L105 172 L115 146 L90 140 Z" fill="none" stroke="#cfe8f5" stroke-width="1.5" stroke-linejoin="round"/>
<g class="hm">
<line x1="170" y1="118" x2="170" y2="66" stroke="#cfe8f5" stroke-width="1.5"/>
<rect x="156" y="50" width="28" height="18" fill="none" stroke="#cfe8f5" stroke-width="1.5"/>
</g>
<g class="sp" stroke="#ffd98a" stroke-width="1.5" stroke-linecap="round">
<line x1="100" y1="112" x2="88" y2="98"/>
<line x1="106" y1="110" x2="102" y2="92"/>
<line x1="94" y1="114" x2="80" y2="106"/>
</g>
<rect x="30" y="196" width="180" height="100" fill="#efe9f3" stroke="#555" stroke-width="0.5"/>
<rect x="30" y="196" width="180" height="100" fill="url(#grid)"/>
<rect x="30" y="296" width="180" height="100" fill="#e9f1ee" stroke="#555" stroke-width="0.5"/>
<rect x="30" y="296" width="180" height="100" fill="url(#grid)"/>
<rect x="30" y="396" width="180" height="100" fill="#f3ece6" stroke="#555" stroke-width="0.5"/>
<rect x="30" y="396" width="180" height="100" fill="url(#grid)"/>
<rect x="95" y="202" width="100" height="30" fill="#111"/>
<text x="145" y="217" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#eee">STADS FABRIEK</text>
<rect x="20" y="392" width="200" height="8" fill="#6a6f77"/>
<rect x="20" y="392" width="8" height="104" fill="#6a6f77"/>
<rect x="212" y="392" width="8" height="104" fill="#6a6f77"/>
<line x1="202" y1="100" x2="226" y2="100" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="232" y="100" dominant-baseline="central" font-size="12">LED board</text>
<line x1="198" y1="217" x2="226" y2="217" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="232" y="217" dominant-baseline="central" font-size="12">Sign</text>
<line x1="212" y1="300" x2="226" y2="300" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="232" y="288" dominant-baseline="central" font-size="12">3 IBC tanks</text>
<text x="232" y="306" dominant-baseline="central" font-size="12">RGB LEDs inside</text>
<line x1="222" y1="396" x2="226" y2="396" stroke="#888" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="232" y="396" dominant-baseline="central" font-size="12">Metal frame</text>
</svg>
